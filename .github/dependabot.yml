---
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Generated by dist, which fails CI on any manual change
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
